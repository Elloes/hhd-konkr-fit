settings:
  type: container
  title: Core Settings
  tags: [non-essential]

  children:
    language:
      type: multiple
      tags: [i18n, non-essential, language]
      title: Language
      default: system
      options:
        system: System
        C: English
        zh_CN: Simplified Chinese
        zh_TW: Traditional Chinese
        pt_BR: Portugese (Brazil)
        ru_RU: Russian
        ko: Korean

    theme:
      type: multiple
      tags: [theme-selector, advanced]
      title: "Theme"
      hint: >-
        Allows changing the theme in the UI.
        Default is either Diavolo or your distribution's theme.
      default: default
      options:
        default: Default
        diavolo: Diavolo
        ocean: Atlantis
        vapor: Vapor
        blood_orange: Blood Orange
      
    reset:
      type: action
      tags: [ reset-button, verify ]
      title: Reset Settings
      hint: >-
        Resets all Handheld Daemon settings to their default values.

    upstream_version:
      type: display
      tags: [hhd-version-display, text]
      title: Official HHD version
      hint: >-
        The upstream hhd-dev/hhd release this fork is based on.

    version:
      type: display
      tags: [hhd-version-display, text]
      title: Konkr Fit fork version
      hint: "Displays the hhd-konkr-fit fork version."

    version_ui:
      type: display
      tags: [hhd-version-display, text]
      title: UI Version
      hint: "Displays the Handheld Daemon version."

    update_stable:
      type: action
      tags: [hhd-update-stable, verify]
      title: Update
      hint: >-
        Updates to the latest hhd-konkr-fit fork release from its self-hosted
        channel (local install only).

    update_error:
      title: Update Error
      type: display
      tags: [ error, non-essential ]

http:
  type: container
  tags: [hhd-http, advanced, expert]
  title: API Configuration
  hint: >-
    Settings for configuring the http endpoint of HHD.

  children:
    localhost:
      type: bool
      title: Limit Access to localhost
      tags: [advanced]
      hint: >-
        Sets the API target to '127.0.0.1' instead '0.0.0.0'.
      default: True
    token:
      type: bool
      title: Use Security token
      tags: [advanced]
      hint: >-
        Generates a security token in `~/.config/hhd/token` that is required for
        authentication.
      default: True
